<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MouseKeysFX</title>
<link rel="stylesheet" href="css/ae.css">
</head>
<body>
<div id="app">
  <div class="tabs" role="tablist">
    <button class="tab on" role="tab" data-mode="mouse">Mouse</button>
    <button class="tab" role="tab" data-mode="kb">Keyboard</button>
  </div>

  <section id="mouse" class="mode">
    <div class="row">
      <label for="mouse-preset">Preset</label>
      <select id="mouse-preset"></select>
      <button class="btn" id="mouse-custom" aria-expanded="false">Customize</button>
    </div>
    <div class="row">
      <label for="mouse-repeat">Clicks</label>
      <input type="number" id="mouse-repeat" min="1" max="50" step="1">
    </div>
    <div class="cards" id="mouse-cards" hidden></div>
  </section>

  <section id="kb" class="mode" hidden>
    <div class="row">
      <label for="kb-preset">Preset</label>
      <select id="kb-preset"></select>
      <button class="btn" id="kb-custom" aria-expanded="false">Customize</button>
    </div>
    <div class="row top">
      <label for="kb-text">Text</label>
      <textarea id="kb-text" rows="3" spellcheck="false"></textarea>
    </div>
    <div class="row">
      <label for="kb-wpm">Tempo</label>
      <input type="number" id="kb-wpm" min="10" max="300" step="1">
      <span class="unit" id="kb-info">WPM</span>
    </div>
    <div class="cards" id="kb-cards" hidden></div>
  </section>

  <div class="foot">
    <button class="btn primary" id="add">Add to comp</button>
    <div id="status" role="status"></div>
  </div>
</div>
<script src="js/cs.js"></script>
<script src="js/sound-library.js"></script>
<script src="js/engine.js"></script>
<script src="js/main.js"></script>
</body>
</html>
