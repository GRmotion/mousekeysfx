<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<title>MouseKeysFX</title>
<style>
:root{
  --bg:#0e1013; --panel:#161a1f; --panel2:#1d2229; --line:#2a313a;
  --text:#e6e9ee; --muted:#8b95a3; --accent:#f5a524; --accent-ink:#1a1204;
  --wave:#6f8197; --key:#5ec8e5; --space:#f5a524; --enter:#e87bd0; --head:#ffffff;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f4f6; --panel:#ffffff; --panel2:#eef0f3; --line:#d9dde3;
    --text:#14181d; --muted:#667180; --accent:#c77d00; --accent-ink:#ffffff;
    --wave:#7c8da1; --key:#0b8fb3; --space:#c77d00; --enter:#c2399c; --head:#14181d;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3f4f6; --panel:#ffffff; --panel2:#eef0f3; --line:#d9dde3;
  --text:#14181d; --muted:#667180; --accent:#c77d00; --accent-ink:#ffffff;
  --wave:#7c8da1; --key:#0b8fb3; --space:#c77d00; --enter:#c2399c; --head:#14181d;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));max-width:1200px;margin:0 auto}
.brand h1{margin:0;font-size:20px;letter-spacing:.2px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;color:var(--muted);padding:8px 22px;border-radius:7px;font:inherit;font-weight:600;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-ink)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:16px;max-width:1200px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.stage{order:-1}}
.stage{position:sticky;top:12px;display:grid;gap:16px}
@media (max-width:900px){.stage{position:static}}
.panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start}
.panel[hidden]{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h2{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted)}
.ctl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:0 0 10px}
.ctl .lbl{font-weight:500}
.ctl output{color:var(--muted);font-variant-numeric:tabular-nums}
.ctl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent);margin:0}
select,textarea,input[type=text]{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
textarea{grid-column:1/-1;resize:vertical;min-height:84px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.chk{display:flex;gap:8px;align-items:center;margin:0 0 10px;cursor:pointer}
.chk input{accent-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 auto}
button.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
button.btn:hover{border-color:var(--muted)}
button.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
button.btn:focus-visible,.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
canvas#scope{width:100%;height:150px;display:block;background:var(--panel2);border-radius:8px}
.legend{display:flex;gap:14px;color:var(--muted);font-size:12px;margin:8px 0 12px;flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
#screen{background:var(--panel2);border-radius:8px;padding:10px 12px;min-height:96px;max-height:180px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;margin-bottom:12px}
#screen.idle{color:var(--muted)}
.caret{display:inline-block;width:7px;height:1.1em;vertical-align:text-bottom;background:var(--accent);margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#clickPad{user-select:none;touch-action:none;text-align:center;padding:22px 10px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);cursor:pointer;margin-top:12px}
#clickPad.down{background:var(--panel2);color:var(--text);border-color:var(--accent)}
#kbPad{margin-top:12px}
.stats{color:var(--muted);font-size:12px;margin:-2px 0 10px}
body[data-tab=mouse] [data-only=kb],body[data-tab=kb] [data-only=mouse]{display:none!important}
.hint{color:var(--muted);font-size:12px;margin:6px 0 0}
</style>
</head>
<body data-tab="mouse">
<header class="top">
  <div class="brand"><h1>MouseKeysFX</h1><p>Synthetic mouse-click and keyboard-typing sound simulator</p></div>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="mouse" aria-selected="true">Mouse</button>
    <button role="tab" data-tab="kb" aria-selected="false">Keyboard</button>
  </div>
</header>

<main class="layout">
  <section id="controls"><div class="panel" id="panel-mouse"></div><div class="panel" id="panel-kb" hidden></div></section>

  <aside class="stage">
    <div class="card">
      <h2>Preview</h2>
      <canvas id="scope" aria-label="Waveform preview"></canvas>
      <div class="legend" id="legend"></div>
      <div id="screen" class="idle" data-only="kb"></div>
      <div class="row">
        <button class="btn primary" id="btnPlay"></button>
        <button class="btn" id="btnStop">Stop</button>
      </div>
      <div class="row" style="margin-top:8px" data-only="mouse">
        <button class="btn" id="btnOneClick">Single click</button>
      </div>
      <div class="row" style="margin-top:8px" data-only="kb">
        <button class="btn" data-aud="key">Key</button>
        <button class="btn" data-aud="space">Space</button>
        <button class="btn" data-aud="enter">Enter</button>
      </div>
      <div id="clickPad" data-only="mouse" tabindex="0">Press and hold here to test the click live</div>
      <input type="text" id="kbPad" data-only="kb" placeholder="Click here and type to test the sound live…" autocomplete="off" spellcheck="false">
    </div>

    <div class="card">
      <h2>Export</h2>
      <div class="row">
        <label style="flex:1 1 120px">Sample rate
          <select data-g="exp" data-k="sr" data-num="1"><option value="44100">44.1 kHz</option><option value="48000">48 kHz</option><option value="96000">96 kHz</option></select></label>
        <label style="flex:1 1 120px">Bit depth
          <select data-g="exp" data-k="bits"><option value="16">16-bit PCM</option><option value="24">24-bit PCM</option><option value="32f">32-bit float</option></select></label>
        <label style="flex:1 1 120px">Channels
          <select data-g="exp" data-k="ch"><option value="2">Stereo</option><option value="1">Mono</option></select></label>
      </div>
      <label class="chk" style="margin-top:10px"><input type="checkbox" data-g="exp" data-k="norm"> Normalize to −1 dBFS</label>
      <label data-only="kb" style="display:block;margin-bottom:10px">Single-hit sample
        <select data-g="kb" data-k="single"><option value="key">Regular key</option><option value="space">Space bar</option><option value="enter">Enter</option></select></label>
      <div class="row">
        <button class="btn primary" id="btnExport">Export WAV</button>
        <button class="btn" id="btnExportOne">Export single hit</button>
        <button class="btn" id="btnExportCsv">Markers CSV</button>
      </div>
      <p class="hint" id="exportHint"></p>
    </div>
  </aside>
</main>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.min(b,Math.max(a,v));
const dB = x => Math.pow(10,x/20);

/* ---------- state ---------- */
const DEF = {
  mouse:{preset:'Magic Mouse',speed:65,smooth:65,tone:40,body:55,click:15,release:25,hold:90,human:30,
         repeat:3,interval:450,double:false,dblgap:110,vol:80,room:10,seed:3},
  kb:{preset:'Magic Keyboard',speed:70,smooth:55,tone:50,depth:30,click:0,release:35,human:30,
      spaceBoost:4,spacePitch:-5,enterBoost:3,enterPitch:-3,rattle:40,
      text:'Hello world,\nthis is a synthetic typing simulation.\nEvery space and enter has its own weight.\n',
      duration:18,rhythm:40,burst:35,pauseSpace:40,pauseEnter:200,pausePunct:80,seed:7,
      vol:80,room:15,spread:35,single:'key'},
  exp:{sr:44100,bits:'16',ch:'2',norm:true}
};
const PRESETS = {
  mouse:{
    'Magic Mouse':     {speed:65,smooth:65,tone:40,body:55,click:15,release:25,hold:90,human:30},
    'MacBook trackpad':{speed:70,smooth:60,tone:30,body:70,click:5, release:55,hold:60,human:25},
    'Microswitch':     {speed:60,smooth:25,tone:55,body:35,click:75,release:60,hold:70,human:30},
    'Quiet office':    {speed:55,smooth:80,tone:40,body:40,click:35,release:30,hold:80,human:30},
    Gaming:            {speed:85,smooth:10,tone:68,body:20,click:85,release:70,hold:45,human:20}
  },
  kb:{
    'Magic Keyboard':   {speed:70,smooth:55,tone:50,depth:30,click:0, release:35,human:30},
    'MacBook Pro':      {speed:74,smooth:50,tone:55,depth:25,click:0, release:40,human:30},
    'MacBook butterfly':{speed:82,smooth:25,tone:68,depth:20,click:10,release:50,human:30},
    'Linear thock':     {speed:45,smooth:60,tone:35,depth:75,click:5, release:40,human:35},
    Tactile:            {speed:55,smooth:45,tone:45,depth:55,click:40,release:45,human:35},
    'Clicky blue':      {speed:75,smooth:15,tone:60,depth:35,click:100,release:60,human:35}
  }
};
const state = JSON.parse(JSON.stringify(DEF));
const STORE = 'mousekeysfx.v2';
try{
  const saved = JSON.parse(localStorage.getItem(STORE)||'null');
  if(saved) for(const g in state) Object.assign(state[g], saved[g]||{});
}catch(e){}
const save = () => { try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} };
let tab = 'mouse';

/* ---------- controls UI ---------- */
const S = (k,l,min,max,u='',hint='',step=1) => ({k,l,min,max,u,hint,step});
const SOUND_KEYS = {mouse:['speed','smooth','tone','body','click','release','hold','human'],
                    kb:['speed','smooth','tone','depth','click','release','human']};
const SECT = {
  mouse:[
    ['Sound',[
      S('speed','Snap speed',0,100,'%','Slow, soft decay ↔ fast, tight snap'),
      S('smooth','Smoothness',0,100,'%','Harsh and crackly ↔ round and soft'),
      S('tone','Tone',0,100,'%','Low and dull ↔ high and bright'),
      S('body','Body',0,100,'%','Low thump under the click'),
      S('click','Switch click',0,100,'%','Sharp micro-switch snap on top of the shell sound'),
      S('release','Release click',0,100,'%','Level of the button-up click'),
      S('hold','Hold time',20,250,' ms','Time between press and release'),
      S('human','Humanize',0,100,'%','Random variation per click')]],
    ['Sequence',[
      S('repeat','Clicks',1,30),
      S('interval','Interval',80,2000,' ms','Time between clicks'),
      'double',
      S('dblgap','Double-click gap',60,300,' ms')]],
    ['Output',[S('vol','Volume',0,100,'%'),S('room','Room',0,100,'%','Short synthetic room reverb')]]
  ],
  kb:[
    ['Sound',[
      S('speed','Snap speed',0,100,'%','Slow, soft decay ↔ fast, tight snap'),
      S('smooth','Smoothness',0,100,'%','Harsh and crackly ↔ round and soft'),
      S('tone','Tone',0,100,'%','Low thock ↔ high clack'),
      S('depth','Depth',0,100,'%','Low-end body of the key bottoming out'),
      S('click','Switch click',0,100,'%','0 = linear, 40 = tactile, 100 = clicky'),
      S('release','Release sound',0,100,'%','Level of the key-up sound'),
      S('human','Humanize',0,100,'%','Random velocity and pitch variation')]],
    ['Big keys',[
      S('spaceBoost','Space loudness',-6,12,' dB','Space bar level relative to a normal key'),
      S('spacePitch','Space pitch',-12,4,' st','Lower = bigger, deeper key'),
      S('enterBoost','Enter loudness',-6,12,' dB'),
      S('enterPitch','Enter pitch',-12,4,' st'),
      S('rattle','Stabilizer rattle',0,100,'%','Wire rattle on space and enter')]],
    ['Typing',['text',
      S('duration','Typing duration',1,120,' s','Time from the first to the last keystroke'),
      S('rhythm','Rhythm variation',0,100,'%','Random timing between keys'),
      S('burst','Burstiness',0,100,'%','Words typed at different speeds'),
      S('pauseSpace','Pause after space',0,300,'%','Extra delay before the next key'),
      S('pauseEnter','Pause after enter',0,600,'%'),
      S('pausePunct','Pause after , . ! ?',0,300,'%'),
      'reroll']],
    ['Output',[S('vol','Volume',0,100,'%'),S('room','Room',0,100,'%','Short synthetic room reverb'),
               S('spread','Stereo spread',0,100,'%','Pan keys by position on the keyboard')]]
  ]
};
const DEFS = {};
function buildPanel(g){
  const el = $(g==='mouse'?'panel-mouse':'panel-kb');
  DEFS[g] = {};
  const presetCard = `<div class="card"><h2>${g==='mouse'?'Click type':'Switch type'}</h2>
    <select data-g="${g}" data-k="preset">${Object.keys(PRESETS[g]).map(n=>`<option>${n}</option>`).join('')}<option>Custom</option></select></div>`;
  let html = presetCard;
  for(const [title,items] of SECT[g]){
    html += `<div class="card"><h2>${title}</h2>`;
    for(const d of items){
      if(d==='double') html += `<label class="chk"><input type="checkbox" data-g="mouse" data-k="double"> Double click</label>`;
      else if(d==='text') html += `<label class="ctl"><span class="lbl">Text to type</span><textarea data-g="kb" data-k="text" spellcheck="false"></textarea></label>
        <div class="stats" id="kbStats"></div>`;
      else if(d==='reroll') html += `<div class="row"><button class="btn" id="btnReroll">Re-roll timing</button></div>`;
      else{
        DEFS[g][d.k] = d;
        html += `<label class="ctl" title="${d.hint}"><span class="lbl">${d.l}</span><output data-out="${g}.${d.k}"></output>
          <input type="range" data-g="${g}" data-k="${d.k}" min="${d.min}" max="${d.max}" step="${d.step}"></label>`;
      }
    }
    html += `</div>`;
  }
  el.innerHTML = html;
}
buildPanel('mouse'); buildPanel('kb');

function syncUI(){
  document.querySelectorAll('[data-g]').forEach(el=>{
    const g=el.dataset.g, k=el.dataset.k, v=state[g][k];
    if(el.type==='checkbox') el.checked = !!v;
    else if(el.value !== String(v)) el.value = v;
    const out = document.querySelector(`[data-out="${g}.${k}"]`);
    if(out) out.textContent = v + (DEFS[g]&&DEFS[g][k] ? DEFS[g][k].u : '');
  });
  updateStats();
}

/* ---------- DSP helpers ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const gauss = r => Math.sqrt(-2*Math.log(1-r()))*Math.cos(2*Math.PI*r());

function makeIR(ctx,len){
  const n=Math.floor(ctx.sampleRate*len), b=ctx.createBuffer(2,n,ctx.sampleRate), r=mulberry32(99);
  for(let c=0;c<2;c++){
    const d=b.getChannelData(c); let lp=0;
    for(let i=0;i<n;i++){ lp+=((r()*2-1)-lp)*0.35; d[i]=lp*Math.pow(1-i/n,3.5); }
  }
  return b;
}
function makeChain(ctx,p){
  const input=ctx.createGain();
  const comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-8; comp.knee.value=8; comp.ratio.value=10; comp.attack.value=0.002; comp.release.value=0.12;
  const master=ctx.createGain(); master.gain.value=Math.pow(p.vol/100,1.6)*1.4;
  input.connect(comp);
  if(p.room>0){
    const conv=ctx.createConvolver(); conv.buffer=makeIR(ctx,0.35);
    const wet=ctx.createGain(); wet.gain.value=p.room/100*0.7;
    input.connect(conv); conv.connect(wet); wet.connect(comp);
  }
  comp.connect(master); master.connect(ctx.destination);
  return {input,out:master};
}

/* ---------- mouse voice ---------- */
function mouseVar(rng,p){
  return {vel:clamp(1+gauss(rng)*p.human/100*0.15,0.6,1.35), pit:1+gauss(rng)*p.human/100*0.03};
}
function mouseEvents(p){
  const rng=mulberry32(p.seed*104729+3), evs=[], lead=0.1;
  for(let i=0;i<p.repeat;i++){
    const base=lead+i*p.interval/1000+(i?gauss(rng)*p.human/100*0.02:0);
    const times=p.double?[base,base+p.dblgap/1000*clamp(1+gauss(rng)*p.human/100*0.15,0.7,1.3)]:[base];
    for(const t of times)
      evs.push({t:Math.max(0,t),kind:'click',...mouseVar(rng,p),hold:p.hold/1000*clamp(1+gauss(rng)*p.human/100*0.2,0.6,1.5)});
  }
  return evs;
}

/* ---------- keyboard voice ---------- */
const ROWS=['`1234567890-=','qwertyuiop[]',"asdfghjkl;'",'zxcvbnm,./'], ROWOFF=[0,0.5,0.75,1.25];
function keyX(c,kind){
  if(kind==='space') return 0.5;
  if(kind==='enter') return 0.93;
  const l=c.toLowerCase();
  for(let r=0;r<4;r++){ const i=ROWS[r].indexOf(l); if(i>=0) return (ROWOFF[r]+i+0.5)/14.5; }
  return 0.5;
}
function keyEvent(c,rng,p){
  const kind=c===' '?'space':c==='\n'?'enter':'key';
  const h=(Math.imul(c.codePointAt(0),2654435761)>>>0)%1000/1000;
  return {c,kind,
    vel:clamp(1+gauss(rng)*p.human/100*0.18,0.55,1.4),
    pit:(1+(h-0.5)*0.08)*(1+gauss(rng)*p.human/100*0.025),
    pan:(keyX(c,kind)-0.5)*2*p.spread/100,
    hold:0.04+rng()*0.05};
}
function typingEvents(p){
  const rng=mulberry32(p.seed*7919+1);
  const chars=[...p.text.replace(/\r/g,'')], n=chars.length;
  const evs=chars.map(c=>keyEvent(c,rng,p));
  if(!n) return evs;
  const raw=[]; let wm=1, sum=0;
  for(let i=1;i<n;i++){
    const prev=chars[i-1];
    if(prev===' '||prev==='\n') wm=Math.exp(gauss(rng)*p.burst/100*0.5);
    const pause = prev===' ' ? p.pauseSpace/100 : prev==='\n' ? p.pauseEnter/100 : /[.,;:!?]/.test(prev) ? p.pausePunct/100 : 0;
    const g=Math.max(0.2,(1+pause)*wm*Math.exp(gauss(rng)*p.rhythm/100*0.5));
    raw.push(g); sum+=g;
  }
  const k=n>1?p.duration/sum:0;
  let t=0.15; evs[0].t=t;
  for(let i=1;i<n;i++){ t+=raw[i-1]*k; evs[i].t=t; }
  for(let i=0;i<n;i++){
    const gap=i<n-1?evs[i+1].t-evs[i].t:0.3;
    evs[i].hold=clamp(evs[i].hold,0.03,Math.max(0.03,gap*0.85));
  }
  return evs;
}

/* ---------- sample-level synthesis ----------
   Every hit is built sample by sample from damped resonant modes (plastic shell, keycap, plate, switch leaf)
   plus short filtered noise for the contact. There are no pitch sweeps, which is what made the first
   version sound like interface beeps. */
function filtInPlace(x,type,f,q,sr){
  const w=2*Math.PI*Math.min(f,sr*0.45)/sr, c=Math.cos(w), s=Math.sin(w), al=s/(2*q), a0=1+al;
  let b0,b1,b2;
  if(type==='lowpass'){b0=(1-c)/2;b1=1-c;b2=b0;}
  else if(type==='highpass'){b0=(1+c)/2;b1=-(1+c);b2=b0;}
  else{b0=al;b1=0;b2=-al;}
  b0/=a0;b1/=a0;b2/=a0; const a1=-2*c/a0, a2=(1-al)/a0;
  let x1=0,x2=0,y1=0,y2=0;
  for(let i=0;i<x.length;i++){
    const v=x[i], y=b0*v+b1*x1+b2*x2-a1*y1-a2*y2;
    x2=x1;x1=v;y2=y1;y1=y;x[i]=y;
  }
}
const newHit=(sr,dur)=>({sr,n:Math.ceil(dur*sr),d:new Float32Array(Math.ceil(dur*sr))});
function addMode(h,t,f,tau,amp,rng,att=0.0002){
  const sr=h.sr, i0=Math.floor(t*sr);
  if(i0>=h.n||amp<=0) return;
  const len=Math.min(h.n-i0,Math.ceil(tau*7*sr)), w=2*Math.PI*f*(1+(rng()-0.5)*0.04)/sr;
  const cw=Math.cos(w), sw=Math.sin(w), dec=Math.exp(-1/(tau*sr)), na=Math.max(1,att*sr);
  const ph=rng()*6.283; let s=Math.sin(ph), c=Math.cos(ph), env=amp*(0.9+rng()*0.2);
  for(let i=0;i<len;i++){
    h.d[i0+i]+=env*(i<na?i/na:1)*s;
    const ns=s*cw+c*sw; c=c*cw-s*sw; s=ns; env*=dec;
  }
}
function burst(h,t,dur,amp,rng,type,f,q,att=0.0002){
  const sr=h.sr, i0=Math.floor(t*sr), len=Math.min(h.n-i0,Math.ceil(dur*sr*5));
  if(len<=0||amp<=0) return;
  const x=new Float32Array(len), tau=dur/2.2, na=Math.max(1,att*sr);
  for(let i=0;i<len;i++) x[i]=(rng()*2-1)*Math.exp(-i/sr/tau)*(i<na?i/na:1);
  if(type) filtInPlace(x,type,f,q,sr);
  let pk=0; for(let i=0;i<len;i++) pk=Math.max(pk,Math.abs(x[i]));
  if(pk<1e-9) return;
  const k=amp/pk; for(let i=0;i<len;i++) h.d[i0+i]+=x[i]*k;

function finishHit(h,sm,target,vel){
  const lp=16000*Math.pow(0.2,sm)*clamp(vel,0.6,1.3);

  let pk=0; for(let i=0;i<h.n;i++) pk=Math.max(pk,Math.abs(h.d[i]));

}
const toneScale=p=>Math.pow(2,(p.tone-50)/50*1.1);

function mouseSynth(p,e,rng,up,sr){
  const S=Math.pow(2,(50-p.speed)/50*1.2), c=p.click/100, body=p.body/100, F=toneScale(p)*e.pit;
  const h=newHit(sr,0.35);
  if(!up){
    if(c>0){
      burst(h,0,0.0012*S,c*0.9,rng,'bandpass',3600*F,1.3);
      addMode(h,0,3300*F,0.0035*S,c*0.45,rng); addMode(h,0,5100*F,0.0025*S,c*0.3,rng);
    }
    addMode(h,0.0006,640*F,0.013*S,0.7,rng); addMode(h,0.0006,1210*F,0.009*S,0.45,rng); addMode(h,0.0006,1780*F,0.006*S,0.28,rng);

    if(c>0) burst(h,0,0.001*S,c*0.6,rng,'bandpass',4200*F,1.3);
    addMode(h,0.0005,720*F,0.008*S,0.7,rng); addMode(h,0.0005,1350*F,0.006*S,0.4,rng);
    burst(h,0.0004,0.003*S,0.35,rng,'lowpass',1000*F,0.8,0.0004);
    addMode(h,0.001,210*Math.sqrt(F),0.016*S,body*0.4,rng,0.0008);

}

function keySynth(p,e,rng,up,sr){
  const S=Math.pow(2,(50-p.speed)/50*1.2), depth=p.depth/100, c=p.click/100, big=e.kind!=='key';
  const m = e.kind==='space' ? {f:Math.pow(2,p.spacePitch/12),dec:1.5,gain:dB(p.spaceBoost),thump:1.6}
          : e.kind==='enter' ? {f:Math.pow(2,p.enterPitch/12),dec:1.25,gain:dB(p.enterBoost),thump:1.3}
          : {f:1,dec:1,gain:1,thump:1};
  const F=toneScale(p)*e.pit*m.f, D=S*m.dec, h=newHit(sr,0.45), pl=0.3+0.9*depth;
  let target;

    // fingertip on keycap, keycap ringing, then plate and case after bottom-out
    burst(h,0,0.003*D,0.55,rng,'bandpass',1700*F,0.8,0.0004);
    addMode(h,0.0003,1650*F,0.007*D,0.5,rng,0.0004);
    addMode(h,0.0003,2480*F,0.005*D,0.32,rng,0.0004);
    addMode(h,0.0003,3720*F,0.003*D,0.18,rng,0.0004);
    addMode(h,0.0012,380*F,0.022*D,0.8*pl,rng,0.0008);
    addMode(h,0.0012,720*F,0.014*D,0.45*pl,rng,0.0008);
    addMode(h,0.0012,1150*F,0.009*D,0.25*pl,rng,0.0008);
    addMode(h,0.0012,110*Math.pow(F,0.6),0.035*D,depth*0.9*m.thump,rng,0.001);
    if(c>0){
      burst(h,0,0.0012*S,c*0.9,rng,'bandpass',4800*F,1.4);
      addMode(h,0,3100*F,0.003*S,c*0.5,rng); addMode(h,0,4700*F,0.0022*S,c*0.3,rng);
      if(p.click>70){ burst(h,0.0055,0.001*S,c*0.6,rng,'bandpass',6200*F,1.6); addMode(h,0.0055,5600*F,0.002*S,c*0.3,rng); }
    }
    if(big&&p.rattle>0){
      const n=e.kind==='space'?3:2, r=p.rattle/100;
      for(let i=0;i<n;i++) burst(h,0.012+i*0.007+rng()*0.01,0.003,0.22*r,rng,'bandpass',3200+rng()*1500,2.5);
    }
    target=0.55*e.vel*m.gain;
  } else {
    if(p.release<=0) return null;
    burst(h,0,0.002*S,0.5,rng,'bandpass',(3200+p.tone*20)*e.pit,1.2);
    addMode(h,0.0002,1900*F,0.005*D,0.4,rng,0.0003);
    addMode(h,0.0006,520*F,0.012*D,0.45,rng,0.0006);
    target=0.55*e.vel*Math.sqrt(m.gain)*p.release/100*0.7;
  }

}
const synthHit=(g,p,e,rng,up,sr)=>(g==='mouse'?mouseSynth:keySynth)(p,e,rng,up,sr);
function panGains(pan){ const a=(clamp(pan||0,-1,1)+1)*Math.PI/4; return [Math.cos(a),Math.sin(a)]; }

/* ---------- rendering ---------- */
async function renderEvents(g,p,evs,sr,tail=0.8){
  const end=evs.reduce((m,e)=>Math.max(m,e.t+e.hold),0)+tail+(p.room>0?0.4:0);
  const total=Math.max(1,Math.ceil(end*sr)), L=new Float32Array(total), R=new Float32Array(total);
  const rng=mulberry32(p.seed*31+5);
  for(const e of evs){
    const [gl,gr]=panGains(e.pan);
    for(const up of [false,true]){
      const d=synthHit(g,p,e,rng,up,sr); if(!d) continue;
      const o=Math.floor((e.t+(up?e.hold:0))*sr), n=Math.min(d.length,total-o);
      for(let i=0;i<n;i++){ L[o+i]+=d[i]*gl; R[o+i]+=d[i]*gr; }
    }
  }
  const dry=new AudioBuffer({numberOfChannels:2,length:total,sampleRate:sr});
  dry.copyToChannel(L,0); dry.copyToChannel(R,1);
  const oc=new OfflineAudioContext(2,total,sr), src=oc.createBufferSource();
  src.buffer=dry; src.connect(makeChain(oc,p).input); src.start();
  return {buffer:await oc.startRendering(),events:evs,duration:end};
}
const renderSeq = (g,sr) => renderEvents(g,state[g],g==='mouse'?mouseEvents(state[g]):typingEvents(state[g]),sr);
function singleEvent(g){
  const p=state[g];
  if(g==='mouse') return {t:0.05,kind:'click',vel:1,pit:1,hold:p.hold/1000};
  const c={key:'a',space:' ',enter:'\n'}[p.single]||'a';
  return {...keyEvent(c,mulberry32(1),{human:0,spread:0}),t:0.05,hold:0.07};
}
const renderOne = (g,sr) => renderEvents(g,state[g],[singleEvent(g)],sr,0.3);

const cache = {};
function getRender(g,sr){
  const key=JSON.stringify([g,state[g],sr]);
  if(!cache[g]||cache[g].key!==key) cache[g]={key,promise:renderSeq(g,sr)};
  return cache[g].promise;
}

/* ---------- WAV export ---------- */
function encodeWAV(buf,bits,mono,norm){
  const len=buf.length, sr=buf.sampleRate, nch=mono?1:2;
  const L=buf.getChannelData(0), R=buf.getChannelData(1);
  const ch=[mono?Float32Array.from(L,(v,i)=>(v+R[i])/2):L];
  if(!mono) ch.push(R);
  let gain=1;
  if(norm){ let pk=0; for(const c of ch) for(let i=0;i<len;i++) pk=Math.max(pk,Math.abs(c[i])); if(pk>0) gain=dB(-1)/pk; }
  const flt=bits==='32f', bps=flt?32:+bits, bpf=bps/8;
  const dataLen=len*nch*bpf, extra=flt?12:0;
  const ab=new ArrayBuffer(44+extra+dataLen), v=new DataView(ab);
  let o=0;
  const str=s=>{for(let i=0;i<s.length;i++)v.setUint8(o++,s.charCodeAt(i));};
  const u32=x=>{v.setUint32(o,x,true);o+=4;}, u16=x=>{v.setUint16(o,x,true);o+=2;};
  str('RIFF');u32(36+extra+dataLen);str('WAVE');
  str('fmt ');u32(16);u16(flt?3:1);u16(nch);u32(sr);u32(sr*nch*bpf);u16(nch*bpf);u16(bps);
  if(flt){str('fact');u32(4);u32(len);}
  str('data');u32(dataLen);
  for(let i=0;i<len;i++) for(let c=0;c<nch;c++){
    const s=clamp(ch[c][i]*gain,-1,1);
    if(flt){v.setFloat32(o,s,true);o+=4;}
    else if(bps===16){v.setInt16(o,Math.round(s*32767),true);o+=2;}
    else{const x=Math.round(s*8388607);v.setUint8(o++,x&255);v.setUint8(o++,(x>>8)&255);v.setUint8(o++,(x>>16)&255);}
  }
  return new Blob([ab],{type:'audio/wav'});
}
const crcTable=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
async function zipStore(name,blob){
  const data=new Uint8Array(await blob.arrayBuffer()), nm=new TextEncoder().encode(name);
  let crc=0xFFFFFFFF; for(let i=0;i<data.length;i++) crc=crcTable[(crc^data[i])&255]^(crc>>>8); crc=(crc^0xFFFFFFFF)>>>0;
  const lh=new DataView(new ArrayBuffer(30)), ch=new DataView(new ArrayBuffer(46)), eo=new DataView(new ArrayBuffer(22));
  lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true); lh.setUint16(26,nm.length,true);
  ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true); ch.setUint16(28,nm.length,true);
  const cdOff=30+nm.length+data.length, cdLen=46+nm.length;
  eo.setUint32(0,0x06054b50,true); eo.setUint16(8,1,true); eo.setUint16(10,1,true); eo.setUint32(12,cdLen,true); eo.setUint32(16,cdOff,true);
  return new Blob([lh,nm,data,ch,nm,eo],{type:'application/zip'});
}
// Inside a claude.ai artifact plain downloads are blocked and WAV is not an allowed type, so use the
// downloads capability and wrap WAV in a zip there. Everywhere else a normal download link is used.
async function download(blob,name){
  let dl=null;
  try{ dl=window.claude&&await window.claude.use('downloads'); }catch(e){}
  if(dl){
    if(name.endsWith('.wav')){ blob=await zipStore(name,blob); name=name.replace(/\.wav$/,'.zip'); }
    try{ await dl.save({filename:name,data:blob}); }
    catch(e){ if(e&&e.code==='declined') return null; throw e; }
    return name;
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  return name;
}
function setHint(msg){ $('exportHint').textContent=msg; }
async function doExport(one){
  const x=state.exp; setHint('Rendering…');
  try{
    const r = one ? await renderOne(tab,x.sr) : await renderSeq(tab,x.sr);
    const name = `mousekeysfx-${tab==='mouse'?'click':'typing'}${one?'-single'+(tab==='kb'?'-'+state.kb.single:''):''}.wav`;
    const saved=await download(encodeWAV(r.buffer,x.bits,x.ch==='1',x.norm),name);
    setHint(saved?`Saved ${saved} (${r.duration.toFixed(2)} s, ${x.sr/1000} kHz).`:'Save cancelled.');
  }catch(err){ setHint('Export failed: '+err.message); }
}
async function exportCsv(){

    rows.push(`${e.t.toFixed(4)},${e.kind},"${label.replace(/"/g,'""')}"`);
  }
  const saved=await download(new Blob([rows.join('\n')+'\n'],{type:'text/csv'}),`mousekeysfx-${tab==='mouse'?'click':'typing'}-markers.csv`);

/* ---------- live audio ---------- */
let ac=null, live={chain:null,sig:''};
function getAC(){
  if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended') ac.resume();
  return ac;
}
function liveChain(g){
  const a=getAC(), p=state[g], sig=g+'|'+p.vol+'|'+p.room;
  if(!live.chain||live.sig!==sig){
    const old=live.chain;
    live.chain=makeChain(a,p); live.sig=sig;
    if(old) setTimeout(()=>old.out.disconnect(),2000);
  }
  return live.chain.input;
}
const liveRng = Math.random;
function livePlay(g,e,up){
  const a=getAC(), d=synthHit(g,state[g],e,liveRng,up,a.sampleRate); if(!d) return;
  const b=a.createBuffer(2,d.length,a.sampleRate), [gl,gr]=panGains(e.pan);
  const L=b.getChannelData(0), R=b.getChannelData(1);
  for(let i=0;i<d.length;i++){ L[i]=d[i]*gl; R[i]=d[i]*gr; }
  const src=a.createBufferSource(); src.buffer=b; src.connect(liveChain(g)); src.start();
}
const liveMouse=(e,up)=>livePlay('mouse',e,up);
const liveKey=(e,up)=>livePlay('kb',e,up);
function auditionKey(kind){
  const c={key:'a',space:' ',enter:'\n'}[kind], e=keyEvent(c,liveRng,state.kb);
  liveKey(e,false); setTimeout(()=>liveKey(e,true),e.hold*1000);
}

/* ---------- scope + playback ---------- */
let cur=null, token=0, shown=null;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function drawScope(pos){
  const c=$('scope'), dpr=window.devicePixelRatio||1, w=c.clientWidth, h=c.clientHeight;
  if(!w) return;
  if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){ c.width=Math.round(w*dpr); c.height=Math.round(h*dpr); }
  const x=c.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,h);
  const r=shown&&shown.g===tab?shown.r:null;
  if(!r){ x.fillStyle=css('--muted'); x.font='13px system-ui'; x.fillText('Rendering…',12,24); return; }
  const d0=r.buffer.getChannelData(0), d1=r.buffer.getChannelData(1), N=d0.length, step=N/w, mid=h/2;
  let pk=0; for(let i=0;i<N;i+=8) pk=Math.max(pk,Math.abs(d0[i]),Math.abs(d1[i]));
  const sc=(mid-6)/Math.max(pk,0.25);
  x.fillStyle=css('--wave');
  for(let px=0;px<w;px++){
    const a=Math.floor(px*step), b=Math.min(N,Math.floor((px+1)*step)), st=Math.max(1,Math.floor((b-a)/48));
    let mn=0,mx=0;
    for(let i=a;i<b;i+=st){ const s=(d0[i]+d1[i])/2; if(s<mn)mn=s; if(s>mx)mx=s; }
    x.fillRect(px,mid-mx*sc,1,Math.max(1,(mx-mn)*sc));
  }
  for(const e of r.events){
    const px=Math.round(e.t/r.duration*w);
    x.fillStyle = e.kind==='space'?css('--space'):e.kind==='enter'?css('--enter'):css('--key');
    const hh = e.kind==='space'||e.kind==='enter' ? 22 : 9;
    x.fillRect(px,h-hh,2,hh);
  }
  if(pos!=null){ x.fillStyle=css('--head'); x.fillRect(Math.round(pos/r.duration*w),0,1.5,h); }
}
function updateScreen(pos){
  const el=$('screen');
  if(tab!=='kb') return;
  const text=[...state.kb.text.replace(/\r/g,'')];
  if(pos==null){ el.className=cur?'':'idle'; el.textContent=text.join('')||'Type some text in the Typing card.'; return; }
  const evs=shown.r.events; let k=0; while(k<evs.length&&evs[k].t<=pos) k++;
  el.className=''; el.textContent=text.slice(0,k).join('');
  const caret=document.createElement('span'); caret.className='caret'; el.appendChild(caret);
  el.scrollTop=el.scrollHeight;
}
function tick(){
  if(!cur) return;
  const pos=ac.currentTime-cur.t0;
  drawScope(pos); updateScreen(pos);
  requestAnimationFrame(tick);
}
function stop(){
  if(cur){ try{cur.src.stop();}catch(e){} cur=null; }
  drawScope(); updateScreen();
}
async function refreshScope(){
  const g=tab, my=++token;
  const r=await getRender(g,44100);
  if(my!==token||g!==tab) return;
  shown={g,r}; if(!cur) drawScope();
  updateScreen();
}
let rt=null;
function scheduleRefresh(){ clearTimeout(rt); rt=setTimeout(refreshScope,200); }
async function play(){
  stop();
  const g=tab, r=await getRender(g,44100);
  const a=getAC(), src=a.createBufferSource();
  src.buffer=r.buffer; src.connect(a.destination);
  shown={g,r};
  cur={src,t0:a.currentTime+0.02};
  src.start(cur.t0);
  const me=cur;
  src.onended=()=>{ if(cur===me){ cur=null; drawScope(); updateScreen(); } };
  requestAnimationFrame(tick);
}

window.addEventListener('resize',()=>drawScope(cur?ac.currentTime-cur.t0:undefined));

/* ---------- init ---------- */
document.body.dataset.tab=tab;
syncUI();
$('btnPlay').textContent='▶ Play click sequence';
$('legend').innerHTML=`<span><i style="background:var(--key)"></i>click</span>`;
refreshScope();
})();
